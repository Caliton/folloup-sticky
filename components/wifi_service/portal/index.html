<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuração do Followup</title>
    <script type="module" crossorigin src="./index.js"></script>
    <link rel="stylesheet" crossorigin href="./index.css">
  </head>
  <body>
    <main role="main" aria-label="Configuração do Followup">
      <div id="followupLogo" class="followup-logo" aria-hidden="true"></div>

      <div class="connected-components">
        <ui-network-status id="wifiStatusCard"></ui-network-status>

        <ui-bottom-sheet
          id="wifiSettingsSheet"
          title="Configurações de Wi-Fi"
          description="Busque as redes disponíveis e conecte seu Followup ao Wi-Fi."
        >
          <ui-icon-button
            id="wifiSettingsCloseBtn"
            slot="header-actions"
            variant="ghost"
            aria-label="Fechar configurações de Wi-Fi"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4L13.4 12l5.3 5.3-1.4 1.4L12 13.4l-5.3 5.3-1.4-1.4L10.6 12 5.3 6.7Z" />
            </svg>
          </ui-icon-button>

          <div
            id="wifiSettingsNotification"
            class="wifi-sheet-notification"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
          ></div>

          <ui-network-list id="networkList"></ui-network-list>

          <div class="wifi-connection-form">
            <ui-input
              id="password"
              variant="password"
              label="Senha do Wi-Fi"
              placeholder="Digite a senha da rede"
              autocomplete="off"
            ></ui-input>
          </div>

          <ui-button
            slot="footer"
            id="scanBtn"
            variant="secondary"
          >
            Buscar redes
          </ui-button>
          <ui-button
            slot="footer"
            id="connectBtn"
            variant="primary"
          >
            Conectar
          </ui-button>
        </ui-bottom-sheet>

        <ui-card id="geminiCard" title="Chave da API do Gemini">
            <ui-input
              id="geminiApiKeyInput"
              label="Chave da API do Gemini"
              placeholder="Digite a chave da API do Gemini"
              autocomplete="off"
              inputmode="text"
            ></ui-input>

            <ui-button
              slot="footer"
              id="geminiClearBtn"
              variant="secondary"
            >
              Limpar
            </ui-button>
            <ui-button
              slot="footer"
              id="geminiSaveBtn"
              variant="primary"
            >
              Salvar
            </ui-button>
        </ui-card>

        <ui-card id="timezoneLocationCard" title="Data e hora">
            <ui-select
              id="timezoneSelect"
              label="Fuso horário"
              aria-label="Fuso horário"
            >
              <option value="">Escolha o fuso</option>
            </ui-select>

            <div class="form-control-row">
              <ui-input
                id="manualTimeInput"
                variant="time"
                label="Hora"
              ></ui-input>

              <ui-input
                id="manualDateInput"
                variant="date"
                label="Data atual"
              ></ui-input>
            </div>

            <p class="form-helper-text">
              Escolha o fuso horário para sincronizar a hora automaticamente. Se preferir, ajuste a
              data e a hora manualmente.
            </p>

            <ui-button
              slot="footer"
              id="timezoneLocationClearBtn"
              variant="secondary"
            >
              Limpar
            </ui-button>
            <ui-button
              slot="footer"
              id="timezoneLocationSaveBtn"
              variant="primary"
            >
              Salvar
            </ui-button>
        </ui-card>
      </div>
    </main>

    <ui-toast
      id="statusToast"
      aria-label="Notificação de status"
    ></ui-toast>

  </body>
</html>
